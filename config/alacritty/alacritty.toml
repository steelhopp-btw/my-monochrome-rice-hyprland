# Оболочка по умолчанию (запуск Fish)
[terminal.shell]
program = "/usr/bin/fish"

# Настройки окна и прозрачности
[window]
decorations = "full"
opacity = 0.85          # Сделали менее прозрачной (было 0.70)
blur = true

# Монохромная цветовая палитра
[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.normal]
black = "#222222"
red = "#b0b0b0"
green = "#cccccc"
yellow = "#dddddd"
blue = "#e0e0e0"
magenta = "#eeeeee"
cyan = "#f0f0f0"
white = "#ffffff"

[colors.bright]
black = "#555555"
red = "#ffffff"
green = "#ffffff"
yellow = "#ffffff"
blue = "#ffffff"
magenta = "#ffffff"
cyan = "#ffffff"
white = "#ffffff"
